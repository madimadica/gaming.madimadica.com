<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Hero Equipment</title>
    <link rel="stylesheet" href="/main.css">
    <link rel="stylesheet" href="./hero-equipment.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
</head>
<body>
    <div class="split-pane">
        <div class="left-column">
            <section id="star-bonus-section" class="left-section">
                <h2>Star Bonus</h2>

                <select class="form-select" id="trophyLeagueSelect" aria-label="Select a Trophy League">
                </select>

                <div class="flex-row ore-list">
                    <div>5 Shiny</div>
                    <div>6 Glowy</div>
                </div>
                <div>Per Day</div>
            </section>
            <section id="war-bonus-section" class="left-section">
                <h2>War Bonus</h2>

                <div>
                    <label for="form-label">Town Hall</label>
                    <select class="form-select" id="townHallSelect" aria-label="Select a Town Hall">
                    </select>
                </div>
                <div>
                    <label for="form-label">Wars per Month</label>
                    <select class="form-select" id="warSelect" aria-label="Select a Town Hall">
                    </select>
                </div>
                <div class="flex-row ore-list">
                    <div>6 Shiny</div>
                    <div>6 Glowy</div>
                    <div>6 Starry</div>
                </div>
                <div>Per Attack</div>
            </section>

            <section id="trader-section" class="left-section">
                <h2>Trader</h2>

                <div>
                    <label for="form-label">Starry</label>
                    <select class="form-select" id="traderStarrySelect" aria-label="Select Trader Trades">
                        <option value="0" selected>0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>
                <div>
                    <label for="form-label">Glowy</label>
                    <select class="form-select" id="traderGlowySelect" aria-label="Select Trader Trades">
                        <option value="0" selected>0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>
                <div>
                    <label for="form-label">Shiny</label>
                    <select class="form-select" id="traderShinySelect" aria-label="Select Trader Trades">
                        <option value="0" selected>0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>

                <div class="flex-row ore-list">
                    <div>6 Shiny</div>
                    <div>6 Glowy</div>
                    <div>6 Starry</div>
                </div>
                <div>Per Week</div>
            </section>
        </div>
        <div class="right-column">
            <h1>Hero Equipment</h1>
            <div class="heroes">

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="./hero-equipment.js"></script>
</body>
</html>
